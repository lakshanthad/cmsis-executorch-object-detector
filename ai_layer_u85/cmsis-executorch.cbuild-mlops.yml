# Written by hand, in the format `cbuild setup` emits: the csolution has one
# mlops: node, and that describes the Ethos-U55-256 of the AppKit-E7 (and the
# FVP). This file is the Ethos-U85-256 of the Ensemble E8 (DevKit-E8, the
# M55-HP core drives it), so that the unchanged export writes the DevKit-E8's
# AI layer into this directory:
#
#   cbuild setup cmsis-executorch.csolution.yml --active DevKit-E8   # .cmsis/ensemble_vela.ini
#   python create_ai_layer.py ai_layer_u85/cmsis-executorch.cbuild-mlops.yml
#
# Ethos_U85_SRAM_MRAM is the Ensemble pack's Vela system configuration of the
# E8's Ethos-U85 (ensemble_vela.ini): the scratch in the SRAM (AXI0), the
# weights in the MRAM (AXI1). Shared_Sram puts the constants on AXI1 and the
# arena on AXI0, as for the E7's Ethos-U55.
cbuild-mlops:
  description: YOLO26n vehicle detector of the traffic counter for the Ethos-U85 of the Ensemble E8
  processor:
    type: Cortex-M55
  npu:
    type: Ethos-U85
    macs: 256
  vela:
    ini: ../.cmsis/ensemble_vela.ini
    options: --accelerator-config ethos-u85-256 --system-config Ethos_U85_SRAM_MRAM --memory-mode Shared_Sram
  model:
    clayer: ai_layer.clayer.yml
    name: TrafficVehicles
