#
# CI for the object detection demo: the test image made and the demo built
# for the DevKit-E8 with its committed AI layer, the program of
# `yolo export format=ethos`; the model-export venv on the three host OSes.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SOLUTION: cmsis-executorch

jobs:
  # Linux only: Arm Compiler 6 needs an Arm user-based license. AC6 only: the
  # board layer's scatter file is written for Arm Compiler 6.
  build:
    name: Build for the DevKit-E8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install tools
        uses: ARM-software/cmsis-actions/vcpkg@v1

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache packs
        uses: actions/cache@v6
        with:
          key: cmsis-packs-${{ hashFiles('*.csolution.yml') }}
          path: /home/runner/.cache/arm/packs

      # torch + executorch is a multi-gigabyte install and otherwise dominates
      # the job. Keyed on the requirements files so a pin change rebuilds it.
      - name: Cache model-export venv
        uses: actions/cache@v6
        with:
          key: venv-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'setup_venv.py') }}-ultralytics
          path: .venv

      - name: Create model-export venv
        run: |
          ./setup_venv.sh
          .venv/bin/python -m pip install ultralytics

      # From the bus.jpg of the ultralytics package, which is not ours to
      # redistribute, so not committed.
      - name: Make the test image
        run: .venv/bin/python detect/make_test_image.py

      - name: Build for the DevKit-E8
        run: cbuild ${SOLUTION}.csolution.yml --active DevKit-E8 --packs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-detection
          path: |
            out/**/*.axf
            out/**/*.hex

  # The export flow must work on all three host OSes -- that is the point of a
  # venv-based (rather than Docker-based) model build. No Arm license needed,
  # so this is cheap to matrix. Without this job, Windows
  # support regresses on the first refactor and nobody notices.
  venv-cross-platform:
    name: Model export venv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create model-export venv (POSIX)
        if: runner.os != 'Windows'
        run: ./setup_venv.sh

      - name: Create model-export venv (Windows)
        if: runner.os == 'Windows'
        run: .\setup_venv.bat

      - name: Check the export and import entry points
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
              PY=.venv/Scripts/python.exe
          else
              PY=.venv/bin/python
          fi
          "${PY}" -c "import executorch.backends.arm.quantizer.quantization_annotator; print('arm quantizer OK')"
          # detect/make_ai_layer.py reads the program with ExecuTorch's deserializer.
          "${PY}" -c "from executorch.exir._serialize._program import deserialize_pte_binary; print('pte reader OK')"
          "${PY}" -m py_compile detect/make_ai_layer.py detect/make_test_image.py tools/console_log.py

      - name: Report resolved versions
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
              PY=.venv/Scripts/python.exe
          else
              PY=.venv/bin/python
          fi
          "${PY}" -m pip list | grep -iE "torch|executorch|vela|tosa|flatbuffers"
          # flatbuffers must stay at 24.3.25: tosa-tools wants 25.2.10 and is
          # installed --no-deps precisely to stop that. See
          # requirements-arm-tosa.txt.
          # No grep -q: with pipefail, grep closing the pipe early fails the step.
          "${PY}" -m pip show flatbuffers | grep "Version: 24.3.25" \
              || { echo "::error::flatbuffers pin regressed"; exit 1; }
