#
# Object detection with ExecuTorch on the Ethos-U85 of the Alif Ensemble E8
# DevKit: the COCO-pretrained Ultralytics YOLO26n with all 80 classes, from
# the camera to the panel (detect/detect.cproject.yml,
# documentation/object-detection.md). The AI layer ai_layer_detect/ is the
# program of `yolo export format=ethos`, imported by
# `python detect/make_ai_layer.py`. Two steps build it:
#
#   python detect/make_test_image.py
#   cbuild cmsis-executorch.csolution.yml --active DevKit-E8 --packs
solution:
  created-for: CMSIS-Toolbox@2.14.1
  cdefault:
  compiler: AC6

  packs:
    # Pinned exactly: a program only loads in the runtime of the ExecuTorch
    # release that exported it, and the venv of requirements.txt has the same
    # version. `cbuild --packs` fetches it from the public index.
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: ARM::CMSIS
    - pack: ARM::CMSIS-Compiler
    # DFP + BSP of the Alif Ensemble E8 DevKit.
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0

  target-types:
    # Alif Ensemble E8 DevKit (DK-E8): the Cortex-M55 HP core with the E8's
    # Ethos-U85-256, the ILI9806E 480x800 panel, an MT9M114 camera module.
    # The Secure Enclave has to boot the HP core from its MRAM region:
    # .alif/M55_HP_mram_cfg_e8.json, the "Install M55_HP debug stubs (DevKit-E8)" task.
    - type: DevKit-E8
      board: Alif Semiconductor::DevKit-E8
      device: Alif Semiconductor::AE822FA0E5597LS0:M55_HP
      variables:
        - Board-Layer: $SolutionDir()$/board/DevKit-E8/Board.clayer.yml
      target-set:
        - set:
          images:
            - project-context: detect.Release
          debugger:
            name: J-Link Server
            # SWD at 4 MHz is the pack's <debugProbe> setting for the Ensemble
            # kits. With JTAG the generated "CMSIS Load" task blocks on
            # JLinkExe's interactive JTAG-chain prompt.
            protocol: swd
            clock: 4000000
            start-pname: M55_HP

  build-types:
    - type: Debug
      debug: on
      optimize: debug
    # Everything at full optimization, the packs' sources included (ExecuTorch
    # runtime, Ethos-U driver, RTX, Alif drivers are -O1 in Debug). Debug
    # information stays on: it costs nothing on the target.
    - type: Release
      debug: on
      optimize: speed

  projects:
    - project: ./detect/detect.cproject.yml
